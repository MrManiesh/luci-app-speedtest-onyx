name: Build OpenWrt APK Package

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'scratch/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'scratch/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build method (fast = 15s direct packaging, sdk = official OpenWrt SDK)'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - sdk

jobs:
  build:
    name: Build APK Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # --- Fast Build Mode: Direct Alpine apk mkpkg (~15 seconds) ---
      - name: Build APK Package (Fast Direct Packaging)
        if: "github.event.inputs.build_mode != 'sdk'"
        run: bash .github/scripts/package-apk.sh

      # --- Official OpenWrt SDK Mode: Used for official releases (tags v*) ---
      - name: Prepare feed directory (SDK Release)
        if: "github.event.inputs.build_mode == 'sdk'"
        run: |
          mkdir -p custom-feed/luci-app-speedtest-onyx
          cp -r root htdocs Makefile custom-feed/luci-app-speedtest-onyx/
          chmod -R 0755 custom-feed/luci-app-speedtest-onyx/root/etc/init.d
          chmod -R 0755 custom-feed/luci-app-speedtest-onyx/root/usr/libexec

      - name: Build with OpenWrt SDK (SDK Release)
        if: "github.event.inputs.build_mode == 'sdk'"
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          FEED_DIR: ${{ github.workspace }}/custom-feed
          FEEDNAME: packages_ci
          PACKAGES: luci-app-speedtest-onyx
          NO_REFRESH_CHECK: true

      - name: Collect package artifacts (SDK Release)
        if: "github.event.inputs.build_mode == 'sdk'"
        run: |
          mkdir -p dist
          find bin/ -type f -name "luci-app-speedtest-onyx*" -exec cp -v {} dist/ \;
          echo "=== Collected Package Files ==="
          ls -lh dist/
          PKG_FILE=$(ls dist/ | head -1)
          if [ -z "$PKG_FILE" ]; then
            echo "::error::No package matching luci-app-speedtest-onyx found!"
            exit 1
          fi

      # --- Distribution Steps ---
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-speedtest-onyx
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
